<title>BT Provider Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--seg:rgba(15,23,42,.06);--segln:rgba(15,23,42,.08);--segon:#fff;--segonfg:#1b2433;--bg:#e9edf3;--cap:#5b6577;--glow:rgba(255,255,255,.7);--sh:rgba(15,23,42,.28)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--seg:rgba(255,255,255,.07);--segln:rgba(255,255,255,.1);--segon:#2a3140;--segonfg:#f1f4f9;--bg:#0e1116;--cap:#8b95a7;--glow:rgba(255,255,255,.04);--sh:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--seg:rgba(255,255,255,.07);--segln:rgba(255,255,255,.1);--segon:#2a3140;--segonfg:#f1f4f9;--bg:#0e1116;--cap:#8b95a7;--glow:rgba(255,255,255,.04);--sh:rgba(0,0,0,.6);color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--cap);font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:radial-gradient(ellipse at 50% 30%,var(--glow),transparent 70%)}
#dev{position:relative;flex:none;border-radius:calc(54px*var(--s));background:linear-gradient(145deg,#2b2e35,#14161a);box-shadow:0 calc(30px*var(--s)) calc(70px*var(--s)) var(--sh),inset 0 0 0 calc(2px*var(--s)) #3a3e47,inset 0 0 0 calc(4px*var(--s)) #0b0c0e}
#scr{position:absolute;overflow:hidden;background:#fff;border-radius:calc(22px*var(--s))}
#scr iframe{position:absolute;left:0;top:0;width:1366px;height:1024px;border:0;transform-origin:0 0;background:#fff}
#cam{position:absolute;left:50%;top:calc(14px*var(--s));width:calc(9px*var(--s));height:calc(9px*var(--s));margin-left:calc(-4.5px*var(--s));border-radius:50%;background:radial-gradient(circle at 35% 35%,#2a3550,#07080b 70%)}
#cap{flex:none}
#bar{flex:none;display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
#nav{flex:none;display:flex;align-items:center;gap:8px;padding:4px 12px 4px 14px;border-radius:999px;background:var(--seg);box-shadow:inset 0 0 0 1px var(--segln)}
#nav>span{font:600 13px/1 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--cap);margin-right:2px}
#nav button{width:26px;height:26px;border-radius:50%;border:0;padding:0;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(15,23,42,.18)}
#nav button[aria-checked="true"]{box-shadow:inset 0 0 0 1px rgba(15,23,42,.18),0 0 0 2px var(--bg),0 0 0 4px var(--segonfg)}
#nav button:focus-visible{outline:2px solid #5b9bf0;outline-offset:3px}
#roles,#lvl{flex:none;display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--seg);box-shadow:inset 0 0 0 1px var(--segln)}
#roles button,#lvl button{font:600 13px/1 system-ui,-apple-system,"Segoe UI",sans-serif;border:0;border-radius:999px;padding:9px 18px;color:var(--cap);background:transparent;cursor:pointer}
#roles button[aria-selected="true"],#lvl button[aria-selected="true"]{background:var(--segon);color:var(--segonfg);box-shadow:0 1px 3px rgba(15,23,42,.18)}
#roles button:disabled{opacity:.45;cursor:not-allowed}
#roles button:focus-visible{outline:2px solid #5b9bf0;outline-offset:2px}
</style>

<script>
(function(){
var W=1366,H=1024,BZ=36,PAD=28,CAP=34+44;
var dev=document.getElementById('dev'),scr=document.getElementById('scr'),fr=document.getElementById('app');
function fit(){
  var vw=window.innerWidth,vh=window.innerHeight;
  var s=Math.min((vw-PAD*2)/(W+BZ*2),(vh-PAD*2-CAP)/(H+BZ*2),1.4);if(!(s>0.1))s=0.1;
  document.documentElement.style.setProperty('--s',s);
  dev.style.width=(W+BZ*2)*s+'px';dev.style.height=(H+BZ*2)*s+'px';
  scr.style.left=BZ*s+'px';scr.style.top=BZ*s+'px';scr.style.width=W*s+'px';scr.style.height=H*s+'px';
  fr.style.transform='scale('+s+')';
}
fit();window.addEventListener('resize',fit);
var NAVS=[["Default blue","#a8ceff"],
["MILC - Gradient 01","linear-gradient(180deg,#fcf5ec 0%,#bddff6 100%)"],
["MILC - Gradient 02","linear-gradient(to top right,#fbf7b8 0%,#97f7f5 100%)"],
["MILC - Gradient 03","linear-gradient(180deg,#ffe8ff 0%,#fde8e4 100%)"],
["MILC - Gradient 04","linear-gradient(to top right,#fbf7b8 0%,#c2bbff 100%)"],
["MILC - Gradient 05","linear-gradient(to top right,#fbf7b8 0%,#fdd0df 50%,#c2bbff 100%)"],
["MILC - Gradient 06","radial-gradient(ellipse farthest-corner at 0 0,#fffcc5 0%,#fbd0c8 100%)"],
["MILC - Gradient 07","radial-gradient(ellipse farthest-corner at 0 0,#fecadb 0%,#d8e9ff 50%,#ffffe7 100%)"]];
var navEl=document.getElementById('nav'),navCur=0;
NAVS.forEach(function(n,i){var b=document.createElement('button');b.type='button';b.setAttribute('role','radio');b.setAttribute('aria-checked',i?'false':'true');b.setAttribute('aria-label',n[0]);b.title=n[0];b.dataset.i=i;b.style.background=n[1];navEl.appendChild(b);});
navEl.addEventListener('click',function(e){var b=e.target.closest('button[data-i]');if(!b)return;navCur=+b.dataset.i;
  [].forEach.call(navEl.querySelectorAll('button'),function(x){x.setAttribute('aria-checked',x===b?'true':'false');});
  try{fr.contentWindow.postMessage({bt:'nav',v:NAVS[navCur][1]},'*');}catch(_){}
});
var role='doula';
document.getElementById('roles').addEventListener('click',function(e){
  var b=e.target.closest('button[data-r]');if(!b||b.disabled)return;
  role=b.dataset.r;
  [].forEach.call(document.querySelectorAll('#roles button'),function(x){x.setAttribute('aria-selected',x===b?'true':'false');});
  try{fr.contentWindow.postMessage({bt:'role',v:role},'*');}catch(_){}
});
var lvl='w';
document.getElementById('lvl').addEventListener('click',function(e){
  var b=e.target.closest('button[data-l]');if(!b)return;
  lvl=b.dataset.l;
  [].forEach.call(document.querySelectorAll('#lvl button'),function(x){x.setAttribute('aria-selected',x===b?'true':'false');});
  try{fr.contentWindow.postMessage({bt:'level',v:lvl},'*');}catch(_){}
});
var ready=false,app='';
function start(){
  var doc='<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1366"><style>html{color-scheme:light}html,body{margin:0}[hidden]{display:none!important}</style>'+app+'<script>try{parent.postMessage("bt-ready","*")}catch(e){}<\/script></head></html>';
  window.addEventListener('message',function(e){if(e.data==='bt-ready'){ready=true;if(navCur)try{fr.contentWindow.postMessage({bt:'nav',v:NAVS[navCur][1]},'*');}catch(_){}}});
  try{fr.srcdoc=doc;}catch(e){}
  setTimeout(function(){
    if(ready)return;
    /* iframe blocked: fall back to the plain full-width app */
    document.open();document.write('<!doctype html><html lang="en"><head><meta charset="utf-8"><style>html,body{margin:0}</style>'+app+'</head></html>');document.close();
  },4000);
}
try{
  var b=atob(document.getElementById('src').textContent.trim());var u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
  new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text().then(function(x){app=x;start();},function(){start();});
}catch(e){start();}
})();
</script>
